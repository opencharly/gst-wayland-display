# ORG-WIDE PR-VALIDATOR DISPATCHER — installed in every opencharly repo.
name: charly/pr-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string

# Mirrors opencharly/.github's org-wide-pr-validator-required.yml. This fork is
# outside the org ruleset (default branch `stable`), so it carries its own caller,
# and the caller must grant everything the reusable workflow's jobs ask for: a
# called workflow can never hold more than its caller, so a missing grant is a
# `startup_failure` with no job and no `validate / validate` check at all.
concurrency:
  group: pr-validator-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  checks: read

jobs:
  validate:
    name: validate
    # Same-repository PRs only, as the org caller does it. NOT `head.repo.fork == false`:
    # this repository IS a fork (of games-on-whales), so `fork` is true for every PR's
    # head, including its own branches, and the job was skipped on all of them.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: opencharly/.github/.github/workflows/pr-validator.yml@main
    with:
      pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
      ai_review_provider: ${{ vars.AI_REVIEW_PROVIDER }}
      ai_review_model: ${{ vars.AI_REVIEW_MODEL }}
      ai_review_base_url: ${{ vars.AI_REVIEW_BASE_URL }}
    secrets: inherit
